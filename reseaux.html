<!DOCTYPE html>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {

background-size: cover;
      color: #e0e0ff;

    body::before {

  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.65);
  z-index: 0;
}
    .grid-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image:
        linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px),

      pointer-events: none;
      z-index: 0;
    }
    .content {
      position: relative;
      z-index: 1;
      max-width: 400px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .back-btn {
      background: transparent;
      border: 1px solid rgba(0,200,255,0.3);
      color: #00c8ff;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      letter-spacing: 1px;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 32px;
      display: inline-block;
      text-decoration: none;
    }
    .back-btn:hover { background: rgba(0,200,255,0.1); }
    .page-title {
      text-align: center;
      margin-bottom: 32px;
    }
    .page-title h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      background: linear-gradient(135deg, #00c8ff, #7b2fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .page-title p {
      font-size: 12px;
      color: #666;
      letter-spacing: 3px;
      margin-top: 4px;
    }
    .social-links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .social-card {
      display: flex;
      align-items: center;
      gap: 16px;
      border-radius: 12px;
      padding: 18px 20px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .social-card.instagram {
      background: rgba(193,53,132,0.25);
      border: 1px solid rgba(193,53,132,0.7);
    }
    .social-card.instagram:hover { background: rgba(193,53,132,0.15); }
    .social-card.tiktok {
      background: rgba(0,242,234,0.15);
      border: 1px solid rgba(0,242,234,0.6);
    }
    .social-card.tiktok:hover { background: rgba(0,242,234,0.12); }
    .social-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .instagram .social-icon {
      background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }
    .tiktok .social-icon {
      background: #010101;
      border: 1px solid rgba(0,242,234,0.3);
    }
    .social-info .name {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      color: #fff;
      font-weight: 700;
    }
    .instagram .social-info .pseudo { font-size: 14px; color: #c13584; margin-top: 2px; }
    .tiktok .social-info .pseudo { font-size: 14px; color: #00f2ea; margin-top: 2px; }
    .arrow { margin-left: auto; color: #666; font-size: 20px; }
    .footer-txt {
      text-align: center;
      margin-top: 40px;
      font-size: 11px;
      color: #444;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

    </div>

    <div class="social-links">

      <a href="https://www.instagram.com/yns_bdn08" target="_blank" class="social-card instagram">

        <div class="social-info">
          <div class="name">Instagram</div>
